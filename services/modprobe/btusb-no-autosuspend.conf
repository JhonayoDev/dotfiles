# El driver btusb arranca con enable_autosuspend=Y y, al probe el controlador
# BCM20702 (05ac:8289), vuelve a poner power/control=auto DESPUES de la regla
# udev; eso puede tumbar el enlace A2DP en silencio. Desactivarlo en el driver
# es lo que persiste de verdad.
options btusb enable_autosuspend=0
