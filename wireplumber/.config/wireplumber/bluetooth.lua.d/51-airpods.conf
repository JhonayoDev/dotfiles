-- AirPods: jugador AVRCP ficticio para taps play/pausa/saltar (WirePlumber 0.4)
bluez_monitor.properties["bluez5.dummy-avrcp-player"] = true
-- HFP: el adaptador soporta mSBC/eSCO, pero estos AirPods solo negocian
-- CVSD (8 kHz); el perfil headset-head-unit termina igual en cvsd.
bluez_monitor.properties["bluez5.enable-msbc"] = true
