# MacBook Pro 2014 - Intel Crystal Well (Haswell), solo H.264 por hardware
hwdec=vaapi
# Solo estos codecs por VA-API; VP9/AV1 van por software sin spamear errores
hwdec-codecs=h264,vc1,mpeg2video,mpeg4
vo=gpu
profile=gpu-hq
# PreFIERE H.264 720p (acelerable); si el video no tiene AVC, baja a 480p
# (AV1/VP9 480p por software gasta poco en este i7)
ytdl-format=bestvideo[height<=720][vcodec*=avc]+bestaudio/best[height<=720][vcodec*=avc]/bestvideo[height<=480]+bestaudio/best[height<=480]
# Cookies de tu Firefox .deb (perfil en ~/.config/mozilla) para saltar el
# "Sign in to confirm you're not a bot" de YouTube
ytdl-raw-options=cookies-from-browser=firefox:/home/jhonayo/.config/mozilla/firefox/6c4fe093.default-release
# cache suave para red inestable
cache=yes
demuxer-max-bytes=100M
# OSD minimalista
osd-bar=no
